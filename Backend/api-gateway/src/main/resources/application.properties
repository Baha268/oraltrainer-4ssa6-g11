spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**,/api/users/**,/api/establishments/**,/api/groups/**

spring.cloud.gateway.routes[1].id=content-service
spring.cloud.gateway.routes[1].uri=lb://CONTENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/content/**,/api/certifications/**,/api/subjects/**,/api/grids/**,/api/paths/**,/api/exercises/**

spring.cloud.gateway.routes[2].id=recording-service
spring.cloud.gateway.routes[2].uri=lb://RECORDING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/recording/**,/api/recordings/**

spring.cloud.gateway.routes[3].id=simulation-service
spring.cloud.gateway.routes[3].uri=lb://SIMULATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/simulation/**,/api/simulations/**

spring.cloud.gateway.routes[4].id=feedback-service
spring.cloud.gateway.routes[4].uri=lb://FEEDBACK-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/feedback/**,/api/feedbacks/**,/api/recommendations/**

spring.cloud.gateway.routes[5].id=progress-service
spring.cloud.gateway.routes[5].uri=lb://PROGRESS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/progress/**,/api/alerts/**,/api/attestations/**

spring.cloud.gateway.routes[6].id=analysis-service
spring.cloud.gateway.routes[6].uri=lb://ANALYSIS-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/analysis/**,/api/analyses/**

spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notification/**,/api/notifications/**
